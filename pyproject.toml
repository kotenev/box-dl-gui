[project]
name = "box-dl-gui"
version = "2.0.0"
description = "Download protected box.com shared files as PDF (CustomTkinter + Playwright, macOS-first)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
dependencies = [
  "customtkinter>=5.2",
  "httpx>=0.27",
  "platformdirs>=4",
  "playwright>=1.49",
]

[project.scripts]
box-dl-gui = "box_dl.app:main"
box-dl = "box_dl.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["box_dl*"]
